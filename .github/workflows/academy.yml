name: Academy

# Verifies the learning portal on every change that can affect it. Publishing to GitHub Pages runs only when the repository owner
# starts this workflow by hand with `deploy: true` (see docs/learning/PUBLISHING.md); nothing is deployed automatically.
on:
  pull_request:
    paths: ["academy/**", "universal_ai_fullstack_orchestrator/**", ".github/workflows/academy.yml"]
  push:
    branches: [main]
    paths: ["academy/**", "universal_ai_fullstack_orchestrator/**", ".github/workflows/academy.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the built site to GitHub Pages (owner approval required)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: academy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: academy
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python (data generation reads pallaquino_cli)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: academy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generated data matches the source code
        run: npm run data:check

      - name: Type check
        run: npm run check

      - name: Unit and component tests
        run: npm test

      - name: Content validation (lessons, CLI commands, agent ids)
        run: npm run validate:content

      - name: Build
        run: npm run build

      - name: Internal links
        run: npm run validate:links

      - name: Accessibility (axe-core)
        run: npm run validate:a11y

      - name: Keep the built site for deployment
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-pages-artifact@v5
        with:
          path: academy/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
