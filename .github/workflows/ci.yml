name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    defaults:
      run:
        working-directory: universal_ai_fullstack_orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: universal_ai_fullstack_orchestrator/pyproject.toml

      - name: Configure validation identity locally
        # Applies governance/git_identity.json (jimdev by default) to the local config only.
        run: python -m pallaquino_cli identity --apply-local --json

      - name: Install package
        run: python -m pip install -e .

      - name: Compile Python sources
        run: python -m compileall -q pallaquino_cli scripts tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate framework
        run: python scripts/validate_all.py

      - name: Validate architecture fitness
        run: python scripts/architecture_fitness.py

      - name: Scan repository for committed secrets
        run: python -m pallaquino_cli security audit --target .. --json

      - name: Smoke-test non-editable install
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --quiet .
          "$RUNNER_TEMP/wheel-venv/bin/pallaquino" --version
          "$RUNNER_TEMP/wheel-venv/bin/pallaquino" validate --integrity-only --json > /dev/null
          "$RUNNER_TEMP/wheel-venv/bin/pallaquino" init --target "$RUNNER_TEMP/project" --json > /dev/null
          cd "$RUNNER_TEMP/project" && "$RUNNER_TEMP/wheel-venv/bin/pallaquino" resume --json | grep -q RECONSTRUCTED

      - name: Verify committed release artifact
        if: matrix.python-version == '3.14'
        run: python scripts/verify_zip_integrity.py
