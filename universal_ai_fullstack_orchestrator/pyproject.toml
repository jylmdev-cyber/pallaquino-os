[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pallaquino-autonomous-engineering-os"
version = "0.5.0"
description = "Portable engineering operating system for AI agents"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "jimdev", email = "jylmdev@gmail.com"}]

[project.urls]
Homepage = "https://github.com/jylmdev-cyber/pallaquino-os"
Repository = "https://github.com/jylmdev-cyber/pallaquino-os.git"
Issues = "https://github.com/jylmdev-cyber/pallaquino-os/issues"

[project.scripts]
pallaquino = "pallaquino_cli.__main__:main"

[tool.setuptools]
packages = ["pallaquino_cli", "pallaquino_cli.orchestration", "pallaquino_cli.memory", "pallaquino_cli.providers",
            "pallaquino_cli.tools", "pallaquino_cli.mcp", "pallaquino_cli.extensions", "pallaquino_cli.integrations", "pallaquino_cli.sdk"]
